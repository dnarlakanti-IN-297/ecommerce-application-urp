apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deployer

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      manifest:
        type: string
        required: true
    secrets:
      KUBECONFIG:
        required: true

jobs:
  test-marker:
   steps:
     - name: snapshot-check
       uses: docker://alpine:3.19
       run: echo "MARKER-V2-$(date +%s)"

  deploy-database:
    if: ${{ fromJSON(inputs.manifest)['ecommerce-database'].deploy }}
    uses: dnarlakanti-IN-297/ecommerce-database-urp/.cloudbees/workflows/deploy.yaml
    with:
      artifact-id: latest
      environment: ${{ inputs.environment }}
    secrets: inherit
    vars: inherit

  deploy-backend:
    needs: deploy-database
    if: ${{ fromJSON(inputs.manifest)['ecommerce-backend'].deploy }}
    uses: dnarlakanti-IN-297/ecommerce-backend-urp/.cloudbees/workflows/deploy.yaml
    with:
      artifact-id: latest
      environment: ${{ inputs.environment }}
    secrets: inherit
    vars: inherit

  deploy-frontend:
    needs: deploy-backend
    if: ${{ fromJSON(inputs.manifest)['ecommerce-frontend'].deploy }}
    uses: dnarlakanti-IN-297/ecommerce-frontend-urp/.cloudbees/workflows/deploy.yaml
    with:
      artifact-id: latest
      environment: ${{ inputs.environment }}
    secrets: inherit
    vars: inherit
